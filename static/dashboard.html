<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統一監控儀表板 — 四源整合系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --danger: #ef4444;
            --warning: #f97316;
            --success: #22c55e;
            --info: #0ea5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #666;
        }

        .status-chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chip.active {
            background: #d1fae5;
            color: #065f46;
        }

        .chip.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .chip.inactive {
            background: #f3f4f6;
            color: #6b7280;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 24px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }

        .panel.active {
            display: block;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .metric-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
        }

        .metric-unit {
            font-size: 12px;
            color: #9ca3af;
            margin-left: 4px;
        }

        .signal-level {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin: 16px 0;
        }

        .signal-level.extreme {
            background: #fee2e2;
            color: #991b1b;
        }

        .signal-level.danger {
            background: #ffedd5;
            color: #9a3412;
        }

        .signal-level.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .signal-level.normal {
            background: #dcfce7;
            color: #166534;
        }

        .score-bar {
            width: 100%;
            height: 32px;
            background: #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
            margin: 12px 0;
        }

        .score-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            background: linear-gradient(90deg, var(--primary), #764ba2);
            transition: width 0.3s;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        table th {
            background: #f3f4f6;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        table td {
            padding: 12px 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        table tr:hover {
            background: #f9fafb;
        }

        .code-badge {
            font-family: monospace;
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .footer {
            background: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .update-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid #e5e7eb;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        @media (max-width: 1024px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>📊 統一監控儀表板</h1>
            <div class="subtitle">整合四大數據源實時監控系統</div>
        </div>
        <div class="status-chips">
            <div class="chip active">
                <span class="status-dot"></span>
                <span id="bear-status">Bear Signal</span>
            </div>
            <div class="chip active">
                <span class="status-dot"></span>
                <span id="ic-status">IC Screener</span>
            </div>
            <div class="chip active">
                <span class="status-dot"></span>
                <span id="momentum-status">Momentum</span>
            </div>
            <div class="chip active">
                <span class="status-dot"></span>
                <span id="sector-status">Sector Rotation</span>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab(0)">🎯 空頭信號（Bear Signal）</button>
        <button class="nav-btn" onclick="switchTab(1)">🔍 產業篩選（IC Screener）</button>
        <button class="nav-btn" onclick="switchTab(2)">🔄 板塊輪動（Momentum）</button>
        <button class="nav-btn" onclick="switchTab(3)">📈 流動性分析（Sector Rotation）</button>
        <button class="nav-btn" onclick="switchTab(4)">⚡ 交叉分析（Cross Analysis）</button>
    </div>

    <!-- Tab 0: Bear Signal -->
    <div class="panel active" id="panel-0">
        <div class="panel-title">🎯 外資離場空頭信號 — 9 維綜合評分</div>
        <div id="bear-signal-content" class="loading">載入中...</div>
    </div>

    <!-- Tab 1: IC Screener -->
    <div class="panel" id="panel-1">
        <div class="panel-title">🔍 產業篩選結果 — 多池聯動</div>
        <div id="ic-screener-content" class="loading">載入中...</div>
    </div>

    <!-- Tab 2: Momentum Screener -->
    <div class="panel" id="panel-2">
        <div class="panel-title">🔄 板塊輪動監控 — 流動性追蹤</div>
        <div id="momentum-content" class="loading">載入中...</div>
    </div>

    <!-- Tab 3: Sector Rotation -->
    <div class="panel" id="panel-3">
        <div class="panel-title">📈 20 大板塊流動性分析</div>
        <div id="sector-rotation-content" class="loading">載入中...</div>
    </div>

    <!-- Tab 4: Cross Analysis -->
    <div class="panel" id="panel-4">
        <div class="panel-title">⚡ 四源交叉分析 — 風險預警</div>
        <div id="cross-analysis-content" class="loading">載入中...</div>
    </div>

    <div class="footer">
        <div class="update-time">
            <span>最後更新：<span id="update-time">-</span></span>
            <span>系統版本：P2.1 整合版</span>
            <span>數據源：Bear Signal + IC Screener + Momentum + Sector Rotation</span>
        </div>
    </div>
</div>

<script>
    // 全局數據緩存
    const dataCache = {
        bearSignal: null,
        icScreener: null,
        momentum: null,
        sectorRotation: null,
        lastUpdate: null
    };

    async function switchTab(index) {
        // 更新導航按鈕狀態
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        // 更新面板狀態
        document.querySelectorAll('.panel').forEach((panel, i) => {
            panel.classList.toggle('active', i === index);
        });

        // 按需加載數據
        if (index === 0 && !dataCache.bearSignal) await loadBearSignal();
        if (index === 1 && !dataCache.icScreener) await loadICScreener();
        if (index === 2 && !dataCache.momentum) await loadMomentum();
        if (index === 3 && !dataCache.sectorRotation) await loadSectorRotation();
        if (index === 4) await loadCrossAnalysis();
    }

    async function loadBearSignal() {
        try {
            // 模擬數據（實際應從 Zeabur API 獲取）
            const mockData = {
                date: new Date().toISOString().split('T')[0],
                score: 45.3,
                level: 'WARNING',
                scores: {
                    'D1_外資現貨': 35,
                    'D2_投信現貨': 42,
                    'D3_台指期空單': 52,
                    'D4_台幣貶值': 18,
                    'D5_融資減少': 28,
                    'D6_融券增加': 38,
                    'D7_大盤走勢': 45,
                    'D8_產業輪動': 55,
                    'D9_新聞情緒': 32
                },
                action_text: '縮短持股週期，備好停損'
            };

            dataCache.bearSignal = mockData;
            renderBearSignal(mockData);
        } catch (e) {
            document.getElementById('bear-signal-content').innerHTML = `<div class="loading">⚠️ 載入失敗：${e.message}</div>`;
        }
    }

    function renderBearSignal(data) {
        const levelClass = data.level.toLowerCase();
        const levelText = {
            'extreme': '🔴 極度危險',
            'danger': '🟠 危險',
            'warning': '🟡 警示',
            'normal': '🟢 正常'
        }[levelClass] || data.level;

        const html = `
            <div class="signal-level ${levelClass}">
                ${levelText} — 總評分：${data.score}/100
            </div>
            <div class="score-bar">
                <div class="score-fill" style="width: ${Math.min(data.score, 100)}%">
                    ${Math.round(data.score)}%
                </div>
            </div>

            <div style="background: #f3f4f6; padding: 16px; border-radius: 8px; margin: 16px 0;">
                <strong>建議操作：</strong>${data.action_text}
            </div>

            <div class="panel-title" style="border-top: 2px solid #e5e7eb; padding-top: 16px; margin-top: 16px;">
                9 維度評分拆解
            </div>

            <table>
                <thead><tr>
                    <th>維度</th>
                    <th>評分</th>
                    <th>進度</th>
                </tr></thead>
                <tbody>
                    ${Object.entries(data.scores).map(([dim, score]) => `
                        <tr>
                            <td>${dim}</td>
                            <td>${score}</td>
                            <td>
                                <div class="score-bar" style="margin: 0;">
                                    <div class="score-fill" style="width: ${score}%; background: linear-gradient(90deg, var(--primary), #764ba2);"></div>
                                </div>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.getElementById('bear-signal-content').innerHTML = html;
    }

    async function loadICScreener() {
        try {
            const mockData = {
                poolCount: 14,
                totalStocks: 152,
                pools: [
                    { name: 'IC設計', count: 12, change: '+2' },
                    { name: 'IC製造/代工', count: 8, change: '-1' },
                    { name: '晶圓代工', count: 5, change: '0' },
                    { name: 'HBM伺服器', count: 6, change: '+1' }
                ]
            };

            dataCache.icScreener = mockData;
            renderICScreener(mockData);
        } catch (e) {
            document.getElementById('ic-screener-content').innerHTML = `<div class="loading">⚠️ 載入失敗：${e.message}</div>`;
        }
    }

    function renderICScreener(data) {
        const html = `
            <div class="metric-grid">
                <div class="metric-card">
                    <div class="metric-label">產業池數量</div>
                    <div class="metric-value">${data.poolCount} <span class="metric-unit">個</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">追蹤股票</div>
                    <div class="metric-value">${data.totalStocks} <span class="metric-unit">檔</span></div>
                </div>
            </div>

            <table>
                <thead><tr>
                    <th>產業池名稱</th>
                    <th>股票數</th>
                    <th>日均變化</th>
                </tr></thead>
                <tbody>
                    ${data.pools.map(pool => `
                        <tr>
                            <td>${pool.name}</td>
                            <td>${pool.count}</td>
                            <td>${pool.change}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.getElementById('ic-screener-content').innerHTML = html;
    }

    async function loadMomentum() {
        try {
            const mockData = {
                status: '監控中',
                topWeakening: [
                    { sector: '面板', change: '-45' },
                    { sector: 'HBM記憶體', change: '-30' }
                ]
            };

            dataCache.momentum = mockData;
            renderMomentum(mockData);
        } catch (e) {
            document.getElementById('momentum-content').innerHTML = `<div class="loading">⚠️ 載入失敗：${e.message}</div>`;
        }
    }

    function renderMomentum(data) {
        const html = `
            <div style="background: #dcfce7; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                <strong>系統狀態：</strong> ${data.status}
            </div>
            <div class="panel-title">衰弱族群預警</div>
            <table>
                <thead><tr>
                    <th>族群名稱</th>
                    <th>流動性變化</th>
                </tr></thead>
                <tbody>
                    ${data.topWeakening.map(item => `
                        <tr>
                            <td>${item.sector}</td>
                            <td style="color: var(--danger); font-weight: 600;">${item.change}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.getElementById('momentum-content').innerHTML = html;
    }

    async function loadSectorRotation() {
        try {
            const response = await fetch('/sector_rotation_data.json');
            const data = await response.json();
            dataCache.sectorRotation = data;
            renderSectorRotation(data);
        } catch (e) {
            // 本機模擬數據
            const mockData = {
                data: {
                    data: [
                        { sector: 'EMS電子代工', flow_1y: 941.8, change_1y: 32.0, is_weak: false },
                        { sector: 'PCB高階板', flow_1y: 426.3, change_1y: 624.6, is_weak: false },
                        { sector: 'HBM記憶體', flow_1y: -852.0, change_1y: 110.1, is_weak: true }
                    ]
                }
            };
            dataCache.sectorRotation = mockData;
            renderSectorRotation(mockData);
        }
    }

    function renderSectorRotation(data) {
        const sectors = data.data?.data || [];
        const html = `
            <table>
                <thead><tr>
                    <th>板塊名稱</th>
                    <th>流動性（年）</th>
                    <th>漲跌幅（年）</th>
                    <th>狀態</th>
                </tr></thead>
                <tbody>
                    ${sectors.slice(0, 15).map(s => `
                        <tr>
                            <td>${s.sector}</td>
                            <td style="${s.flow_1y > 0 ? 'color: var(--success);' : 'color: var(--danger);'} font-weight: 600;">
                                ${(s.flow_1y > 0 ? '+' : '')}${s.flow_1y.toFixed(1)}M
                            </td>
                            <td>${(s.change_1y > 0 ? '+' : '')}${s.change_1y.toFixed(1)}%</td>
                            <td>${s.is_weak ? '⚠️ 轉弱' : '✅ 正常'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.getElementById('sector-rotation-content').innerHTML = html;
    }

    async function loadCrossAnalysis() {
        try {
            const html = `
                <div style="background: #fef3c7; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                    ⚡ 高風險警示：空頭信號強 + HBM記憶體轉弱 + 融券增加
                </div>
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-label">信號強度</div>
                        <div class="metric-value">45<span class="metric-unit">/100</span></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">轉弱族群</div>
                        <div class="metric-value">3<span class="metric-unit">個</span></div>
                    </div>
                </div>
                <div class="panel-title">交叉驗證矩陣</div>
                <table>
                    <thead><tr>
                        <th>數據源</th>
                        <th>信號強度</th>
                        <th>信心度</th>
                    </tr></thead>
                    <tbody>
                        <tr>
                            <td>Bear Signal</td>
                            <td>45/100</td>
                            <td>⭐⭐⭐⭐</td>
                        </tr>
                        <tr>
                            <td>Momentum</td>
                            <td>業務表現弱</td>
                            <td>⭐⭐⭐</td>
                        </tr>
                        <tr>
                            <td>Sector Rotation</td>
                            <td>流動性分散</td>
                            <td>⭐⭐⭐⭐⭐</td>
                        </tr>
                    </tbody>
                </table>
            `;
            document.getElementById('cross-analysis-content').innerHTML = html;
        } catch (e) {
            document.getElementById('cross-analysis-content').innerHTML = `<div class="loading">⚠️ 載入失敗：${e.message}</div>`;
        }
    }

    // 初始化
    function init() {
        document.getElementById('update-time').textContent = new Date().toLocaleString('zh-TW');
        loadBearSignal();
    }

    init();

    // 每 5 分鐘自動刷新
    setInterval(() => {
        dataCache.bearSignal = null;
        dataCache.icScreener = null;
        dataCache.momentum = null;
        dataCache.sectorRotation = null;
        document.getElementById('update-time').textContent = new Date().toLocaleString('zh-TW');
    }, 300000);
</script>

</body>
</html>
