<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統一監控儀表板 — 全功能測試版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --danger: #ef4444;
            --warning: #f97316;
            --success: #22c55e;
            --info: #0ea5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1920px; margin: 0 auto; }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #666;
        }

        .test-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .test-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .test-section h2 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }

        .test-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f9fafb;
            border-left: 4px solid #e5e7eb;
        }

        .test-item.pass {
            background: #dcfce7;
            border-left-color: var(--success);
        }

        .test-item.fail {
            background: #fee2e2;
            border-left-color: var(--danger);
        }

        .test-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
        }

        .test-label {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .test-result {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .result-pass { background: #dcfce7; color: #166534; }
        .result-fail { background: #fee2e2; color: #991b1b; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }

        .nav-btn {
            padding: 12px 24px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }

        .panel.active { display: block; }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }

        .footer {
            background: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 1024px) { .panels { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>🧪 全功能測試儀表板</h1>
            <div class="subtitle">完整按鍵功能驗證 + 系統健康檢查</div>
        </div>
        <div class="test-badge">全功能測試版</div>
    </div>

    <!-- 測試統計 -->
    <div class="stats" id="stats-container">
        <div class="stat-card">
            <div class="stat-value">-</div>
            <div class="stat-label">總測試數</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">-</div>
            <div class="stat-label">通過測試</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">-</div>
            <div class="stat-label">失敗測試</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">-</div>
            <div class="stat-label">成功率</div>
        </div>
    </div>

    <!-- 測試報告 -->
    <div class="test-section">
        <h2>🧪 Tab 切換測試（5 個按鈕）</h2>
        <div id="test-tabs"></div>
    </div>

    <div class="test-section">
        <h2>📦 數據加載函數測試（5 個函數）</h2>
        <div id="test-loading"></div>
    </div>

    <div class="test-section">
        <h2>🎨 UI 渲染測試（4 個元素）</h2>
        <div id="test-ui"></div>
    </div>

    <div class="test-section">
        <h2>⚡ 事件綁定測試（2 個函數）</h2>
        <div id="test-events"></div>
    </div>

    <!-- 原儀表板導航 -->
    <div style="margin-top: 40px;">
        <div class="nav">
            <button class="nav-btn active" onclick="switchTab(0)">🎯 空頭信號</button>
            <button class="nav-btn" onclick="switchTab(1)">🔍 產業篩選</button>
            <button class="nav-btn" onclick="switchTab(2)">🔄 板塊輪動</button>
            <button class="nav-btn" onclick="switchTab(3)">📈 流動性分析</button>
            <button class="nav-btn" onclick="switchTab(4)">⚡ 交叉分析</button>
        </div>

        <!-- 內容面板 -->
        <div class="panels">
            <div class="panel active" id="panel-0">
                <div class="panel-title">🎯 空頭信號</div>
                <p>面板 0 - 空頭信號測試區</p>
            </div>
            <div class="panel" id="panel-1">
                <div class="panel-title">🔍 產業篩選</div>
                <p>面板 1 - 產業篩選測試區</p>
            </div>
            <div class="panel" id="panel-2">
                <div class="panel-title">🔄 板塊輪動</div>
                <p>面板 2 - 板塊輪動測試區</p>
            </div>
            <div class="panel" id="panel-3">
                <div class="panel-title">📈 流動性分析</div>
                <p>面板 3 - 流動性分析測試區</p>
            </div>
            <div class="panel" id="panel-4">
                <div class="panel-title">⚡ 交叉分析</div>
                <p>面板 4 - 交叉分析測試區</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <div style="margin-top: 16px;">
            最後更新：<span id="update-time">-</span> | 系統版本：P2.1 測試版
        </div>
    </div>
</div>

<script>
    // ===== 測試套件 =====
    const testSuites = {
        "Tab切換測試": [],
        "數據加載測試": [],
        "UI渲染測試": [],
        "事件綁定測試": []
    };

    // 1. Tab 切換測試
    testSuites["Tab切換測試"] = [
        {
            name: "按鈕 0：空頭信號",
            testFn: () => {
                const btn = document.querySelectorAll('.nav-btn')[0];
                return btn && btn.textContent.includes('空頭信號');
            }
        },
        {
            name: "按鈕 1：產業篩選",
            testFn: () => {
                const btn = document.querySelectorAll('.nav-btn')[1];
                return btn && btn.textContent.includes('產業篩選');
            }
        },
        {
            name: "按鈕 2：板塊輪動",
            testFn: () => {
                const btn = document.querySelectorAll('.nav-btn')[2];
                return btn && btn.textContent.includes('板塊輪動');
            }
        },
        {
            name: "按鈕 3：流動性分析",
            testFn: () => {
                const btn = document.querySelectorAll('.nav-btn')[3];
                return btn && btn.textContent.includes('流動性分析');
            }
        },
        {
            name: "按鈕 4：交叉分析",
            testFn: () => {
                const btn = document.querySelectorAll('.nav-btn')[4];
                return btn && btn.textContent.includes('交叉分析');
            }
        }
    ];

    // 2. 數據加載函數測試
    testSuites["數據加載測試"] = [
        { name: "switchTab() 函數", testFn: () => typeof switchTab === 'function' },
        { name: "loadBearSignal() 函數", testFn: () => typeof loadBearSignal === 'function' },
        { name: "loadICScreener() 函數", testFn: () => typeof loadICScreener === 'function' },
        { name: "loadMomentum() 函數", testFn: () => typeof loadMomentum === 'function' },
        { name: "loadCrossAnalysis() 函數", testFn: () => typeof loadCrossAnalysis === 'function' }
    ];

    // 3. UI 渲染測試
    testSuites["UI渲染測試"] = [
        { name: "頭部區塊（.header）", testFn: () => document.querySelector('.header') !== null },
        { name: "導航按鈕（5個）", testFn: () => document.querySelectorAll('.nav-btn').length === 5 },
        { name: "內容面板（5個）", testFn: () => document.querySelectorAll('.panel').length === 5 },
        { name: "頁尾區塊（.footer）", testFn: () => document.querySelector('.footer') !== null }
    ];

    // 4. 事件綁定測試
    testSuites["事件綁定測試"] = [
        { name: "init() 初始化函數", testFn: () => typeof init === 'function' },
        { name: "onclick 事件綁定", testFn: () => {
            const btn = document.querySelectorAll('.nav-btn')[0];
            return btn && btn.onclick !== null || btn.attributes.onclick !== undefined;
        }}
    ];

    // ===== 執行測試 =====
    function runTests() {
        let totalTests = 0;
        let passedTests = 0;
        const results = {};

        Object.entries(testSuites).forEach(([category, tests]) => {
            results[category] = { total: 0, passed: 0, items: [] };

            tests.forEach(test => {
                totalTests++;
                results[category].total++;

                try {
                    const passed = test.testFn();
                    if (passed) {
                        passedTests++;
                        results[category].passed++;
                    }
                    results[category].items.push({
                        name: test.name,
                        passed: passed
                    });
                } catch (e) {
                    results[category].items.push({
                        name: test.name,
                        passed: false,
                        error: e.message
                    });
                }
            });
        });

        // 更新統計
        const successRate = totalTests > 0 ? ((passedTests / totalTests) * 100).toFixed(1) : 0;
        document.querySelector('.stat-value:nth-child(1)').textContent = totalTests;
        document.querySelector('.stat-value:nth-child(2)').textContent = passedTests;
        document.querySelector('.stat-value:nth-child(3)').textContent = totalTests - passedTests;
        document.querySelector('.stat-value:nth-child(4)').textContent = successRate + '%';

        // 渲染測試結果
        Object.entries(results).forEach(([category, data]) => {
            const containerId = `test-${category.replace(/測試/, '').toLowerCase()}`;
            const container = document.getElementById(containerId);
            if (!container) return;

            let html = '';
            data.items.forEach(item => {
                const className = item.passed ? 'pass' : 'fail';
                const icon = item.passed ? '✅' : '❌';
                const result = item.passed ? '通過' : '失敗';
                html += `
                    <div class="test-item ${className}">
                        <div class="test-icon">${icon}</div>
                        <div class="test-label">${item.name}</div>
                        <div class="test-result ${item.passed ? 'result-pass' : 'result-fail'}">${result}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        // 更新時間
        document.getElementById('update-time').textContent = new Date().toLocaleString('zh-TW');

        console.log(`✅ 測試完成：${passedTests}/${totalTests} 通過 (${successRate}%)`);
    }

    // ===== Tab 切換函數 =====
    function switchTab(index) {
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.panel').forEach((panel, i) => {
            panel.classList.toggle('active', i === index);
        });
    }

    // ===== 占位符函數（原儀表板用）=====
    async function loadBearSignal() { }
    async function loadICScreener() { }
    async function loadMomentum() { }
    async function loadSectorRotation() { }
    async function loadCrossAnalysis() { }

    function init() {
        runTests();
    }

    // 頁面加載時執行
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>

</body>
</html>
